name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: self-hosted # Directs task to your self-hosted runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run Tests
        run: npm test

  # Job 2: Deploy (Runs ONLY if build-and-test passes)
  deploy:
    needs: build-and-test
    runs-on: self-hosted # Can also run on self-hosted (e.g., your production server)
    #if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Prevents PRs from deploying
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Project
        run: |
          echo "Deploying application on self-hosted server..."
          # Insert your deployment commands here (e.g., systemctl restart, docker compose up, etc.)
          npm run build
          pm2 restart all
